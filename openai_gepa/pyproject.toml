[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-gepa"
version = "0.1.0"
description = "Code Reviewer Agent with GEPA Optimization - Built with OpenAI SDK and SuperOptiX"
authors = [
    {name = "SuperOptiX", email = "hello@superoptix.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [

]

[project.optional-dependencies]


[project.urls]
Homepage = "https://github.com/yourusername/openai-gepa"
Repository = "https://github.com/yourusername/openai-gepa.git"
"Bug Tracker" = "https://github.com/yourusername/openai-gepa/issues"

[project.scripts]
openai-gepa = "openai_gepa.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["openai_gepa"]

[tool.hatch.build.targets.wheel.sources]
"openai_gepa" = "openai_gepa"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.ruff]
line-length = 88
target-version = "py311"
